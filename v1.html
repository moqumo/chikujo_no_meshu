<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>戦国築城記 参</title>
<style>
:root{--panel:rgba(26,27,30,.9);--line:rgba(255,255,255,.08);--text:#f2f1ee;--muted:#9b9a96;--accent:#e5533d;--ok:#62c27a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#111214;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit}
#app{height:100%;max-width:640px;margin:0 auto;position:relative}
#wrap{position:absolute;inset:0;overflow:hidden}
canvas{touch-action:none;display:block;position:absolute;left:0;top:0}
.glass{background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:52px;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}
.stat{display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:10px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.stat.warn,.stat.warn b{color:#ff8a72}
.bar{width:28px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.stat.warn .bar i{background:var(--accent)}
#side{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;display:flex;flex-direction:column;gap:6px}
#side button{width:40px;height:40px;border:0;border-radius:12px;font-size:17px}
#side button.on{background:var(--accent)}
#menu{position:absolute;top:calc(8px + env(safe-area-inset-top));right:56px;width:min(300px,calc(100% - 72px));max-height:calc(100% - 110px);overflow:auto;border-radius:16px;padding:6px 6px 10px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:5}
#menu .mhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;padding:8px 8px 4px 10px}
#menu .mhead button{border:0;background:var(--line);width:28px;height:28px;border-radius:50%;font-size:13px;padding:0}
#menu .msec{margin-top:6px}
#menu .mlab{font-size:11px;color:var(--muted);letter-spacing:.08em;padding:6px 10px 3px}
#menu .msec>button{width:100%;border:0;background:none;text-align:left;padding:9px 8px;border-radius:10px;display:flex;align-items:center;gap:10px}
#menu .msec>button:active{background:var(--line)}
#menu .msec>button i{font-style:normal;flex:0 0 30px;height:30px;border-radius:9px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:14px}
#menu .msec>button b{flex:1;font-weight:500;font-size:14px;display:flex;flex-direction:column;gap:1px}
#menu .msec>button b small{font-weight:400;font-size:11px;color:var(--muted);line-height:1.35}
#menu .msec>button span{color:var(--muted);font-size:12px;white-space:nowrap}
#menu .msec>button span.sw{width:34px;height:20px;border-radius:10px;background:rgba(255,255,255,.15);position:relative;font-size:0}
#menu .msec>button span.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#ddd;transition:left .15s}
#menu .msec>button span.sw.on{background:var(--ok)}
#menu .msec>button span.sw.on::after{left:16px}
#menu .msec>button:disabled{opacity:.35}
#undo{position:absolute;right:10px;width:48px;height:48px;border:0;border-radius:14px;font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:2px}
#undo small{font-size:9px;color:var(--muted)}
#undo:disabled{opacity:.35}
#area{position:absolute;left:8px;pointer-events:none;font-size:11px;color:var(--muted);padding:4px 9px;border-radius:9px}
#area b{color:#ffd27a;font-weight:600}
.hide{display:none!important}
#toast{position:absolute;left:50%;top:calc(50px + env(safe-area-inset-top));transform:translateX(-50%);padding:8px 14px;border-radius:10px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .25s;max-width:84%;text-align:center;line-height:1.45}
#chip{position:absolute;left:10px;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;font-size:12px}
#chip button{border:0;background:var(--line);width:22px;height:22px;border-radius:50%;font-size:12px;line-height:22px;padding:0}
#tray{position:absolute;left:10px;right:10px;bottom:calc(78px + env(safe-area-inset-bottom));border-radius:14px;padding:6px}
#tools{display:flex;overflow-x:auto;gap:6px;scrollbar-width:none;align-items:stretch}
.tgrp{flex:0 0 auto;display:flex;flex-direction:column;gap:2px;padding:2px 2px 0;border-radius:11px;background:rgba(255,255,255,.035)}
.tgrp>label{font-size:9.5px;color:var(--muted);letter-spacing:.06em;padding:2px 6px 0}
.tgrp>div{display:flex;gap:1px}
#tools::-webkit-scrollbar{display:none}
body.pc #app{max-width:none}
body.pc #tools{flex-wrap:wrap;overflow-x:visible}
body.pc #tray{left:50%;right:auto;transform:translateX(-50%);max-width:760px;width:calc(100% - 20px)}
body.pc #dock{left:50%;right:auto;transform:translateX(-50%);width:min(760px,calc(100% - 20px))}
body.pc #chip{left:max(10px,calc(50% - 380px))}
.tool{flex:0 0 auto;width:56px;height:62px;border:0;border-radius:10px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:19px;padding:0;position:relative}
.tool small{font-size:10px;color:var(--text);opacity:.85;white-space:nowrap}
.tool em{font-style:normal;font-size:9px;color:#d9c08a;font-variant-numeric:tabular-nums;line-height:1.1}
.tool.lock{opacity:.4}
.tool.lock em{color:#ff9a80}
.tool .lk{position:absolute;top:3px;right:5px;font-size:9px}
.tool.sel{background:rgba(229,83,61,.2)}
.tool.sel small{color:var(--text)}
.sep{flex:0 0 1px;background:var(--line);margin:10px 4px}
#dock{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:stretch}
#tabs{flex:1;display:flex;padding:4px;border-radius:14px}
#tabs button{flex:1;border:0;background:none;border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted)}
#tabs button .g{font-size:17px;color:var(--text);line-height:1.2}
#tabs button.sel{background:rgba(255,255,255,.08);color:var(--text)}
#tabs button:disabled{opacity:.3}
#go{width:78px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:700}
#go.alt{background:var(--panel);font-weight:600}
#kit{position:fixed;inset:0;background:#16130f;z-index:20;display:flex;flex-direction:column;gap:8px;overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));color:var(--text);font-size:13px}
#kit.hide{display:none}
#tst{position:fixed;inset:0;background:rgba(14,14,16,.97);z-index:21;overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));color:var(--text);font-size:13px}
#tst.hide{display:none}
#tst .th{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-10px;background:rgba(14,14,16,.97);padding:8px 0;z-index:1}
#tst .th h2{margin:0;font-size:17px}
#tst .th button{border:0;background:var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
#tst .sec{margin-top:12px;background:rgba(255,255,255,.04);border-radius:14px;padding:6px 12px 10px}
#tst .sec h3{margin:6px 0 4px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em}
#tst .row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
#tst .row:first-of-type{border-top:0}
#tst .row label{font-size:13px}
#tst .row label small{display:block;font-size:10.5px;color:var(--muted)}
#tst .row output{font-variant-numeric:tabular-nums;color:#ffd27a;min-width:52px;text-align:right}
#tst .row input[type=range]{grid-column:1/3;width:100%;accent-color:#e5533d}
#tst .row.mod output{color:#7dff9a}
#tst .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#tst .acts button{border:0;background:rgba(255,255,255,.1);border-radius:10px;padding:9px 12px;font-size:12.5px}
#tst .acts button.warn{background:rgba(229,83,61,.25)}
#tst .prev{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:6px;font-variant-numeric:tabular-nums}
#tst .tg{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.15);border:0;position:relative}
#tst .tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#ddd;transition:left .15s}
#tst .tg.on{background:var(--ok)}
#tst .tg.on::after{left:21px}
#kit>*{flex-shrink:0}
#kit .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#kit .list{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
#kit .list button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;background:rgba(255,255,255,.06);border:1px solid transparent;border-radius:10px;padding:6px 8px;color:var(--text);font-size:11px}
#kit .list button.sel{border-color:#ffd27a;background:rgba(255,210,122,.12)}
#kit canvas{image-rendering:pixelated;image-rendering:crisp-edges;position:static;display:inline-block}
#kit .pal button{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);border:1px solid transparent;border-radius:8px;padding:4px 7px;color:var(--text);font-size:11px}
#kit .pal button.sel{border-color:#ffd27a}
#kit .sw{width:16px;height:16px;border-radius:3px;border:1px solid #0008;display:inline-block}
#kit .act button{background:rgba(255,255,255,.1);border:0;border-radius:9px;padding:8px 11px;color:var(--text);font-size:12px}
#kit .act button.on{background:#ffd27a;color:#222}
#kit input[type=color]{width:22px;height:20px;border:0;padding:0;background:none}
#kit textarea{width:100%;height:120px;background:#0008;color:#ddd;border:1px solid #fff2;border-radius:8px;font-size:11px}
#ov{position:fixed;inset:0;background:rgba(10,10,12,.72);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#ov.hide{display:none}
#ov .box{max-width:420px;width:100%;border-radius:16px;padding:20px 20px 16px;font-size:14px;line-height:1.7;max-height:88vh;overflow:auto}
#ov h1{margin:0 0 4px;font-size:20px}
#ov .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
#ov ol{margin:0;padding-left:1.2em}
#ov li{margin:6px 0}
#ov li span{color:var(--muted);font-size:12.5px;display:block;line-height:1.5}
#ov button{display:block;width:100%;margin-top:16px;height:46px;font-size:15px;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:12px}
#ov .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
#ov .grid button{margin:0;height:44px;background:rgba(255,255,255,.08);font-weight:500}
#ov .grid button.cur{outline:1.5px solid var(--accent)}
#ov button.ghost{background:rgba(255,255,255,.08);margin-top:8px}
</style>
</head>
<body>
<div id="app"><div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <div id="side"><button id="more" class="glass" title="メニュー">☰</button><button id="zfit" class="glass" title="全体を見る">⛶</button><button id="pan" class="glass" title="地図を動かす">✋</button></div>
  <div id="area" class="glass"></div>
  <button id="undo" class="glass" title="ひとつ戻す">↶<small>戻す</small></button>
  <div id="menu" class="glass hide">
    <div class="mhead">メニュー<button id="mclose">✕</button></div>
    <div class="msec"><div class="mlab">普請</div>
      <button id="sample"><i>手</i><b>お手本<small>山城の見本を敷く（陣の後は「まとめて修復」）</small></b><span></span></button>
      <button id="terra"><i>山</i><b>地形を選ぶ<small>山の形を選び直す（最初の普請のみ）</small></b><span></span></button></div>
    <div class="msec"><div class="mlab">表示</div>
      <button id="rng"><i>◎</i><b>射程を表示<small>兵の届く範囲を薄く表示</small></b><span class="sw"></span></button>
      <button id="pcmode"><i>▭</i><b>画面の配置<small>スマホ／PC</small></b><span></span></button></div>
    <div class="msec"><div class="mlab">合戦</div>
      <button id="drop"><i>落</i><b>橋を落とす<small>合戦中のみ。落とした橋は戻せない</small></b><span></span></button></div>
    <div class="msec"><div class="mlab">そのほか</div>
      <button id="howto"><i>？</i><b>遊び方<small>流れと勝ち方</small></b><span></span></button>
      <button id="help"><i>i</i><b>操作のヒント<small>道具とタップの基本</small></b><span></span></button>
      <button id="texkit"><i>▦</i><b>テクスチャ編集<small>ドット絵を描き換える</small></b><span></span></button>
      <button id="tester"><i>⚙</i><b>テスターモード<small>敵の数・強さ・費用などを調整</small></b><span></span></button></div>
  </div>
  <div id="toast" class="glass"></div>
  <div id="chip" class="glass hide"><span id="chipT"></span><button id="chipX">✕</button></div>
  <div id="tray" class="glass hide"><div id="tools"></div></div>
  <div id="dock"><div id="tabs" class="glass"></div><button id="go">開戦</button></div>
</div></div>
<div id="ov"><div class="box glass" id="ovbox"></div></div>
<div id="kit" class="hide"></div>
<div id="tst" class="hide"></div>

<script>
"use strict";
// ================= 定数 =================
const COLS=84, ROWS=84, N=COLS*ROWS,   // v28：盤を1.5倍（旧56）
      MAPC=COLS/2, MAXW=10, START_GOLD=1080;
const FULL_R=21, FB0=MAPC-FULL_R, FB1=MAPC+FULL_R-1;   // 最終的な築城範囲（42×42）
// 築城範囲は陣が進むごとに広がる（山城 → 曲輪を増やす）。r：中心からの半分の幅
const AREA_ST=[{w:1,r:8,n:'山城'},{w:3,r:12,n:'二の丸'},{w:5,r:16,n:'三の丸'},{w:8,r:21,n:'総構え'}];
// 建物の解放：普請する陣（次の陣）がこの陣以上で建てられる
const BLD_UNLOCK={goten:3,annex:3,yashiki:5};
const bldLock=k=>!TUNE.unlockAll&&BLD_UNLOCK[k]&&S.wave+1<BLD_UNLOCK[k]?BLD_UNLOCK[k]:0;
const areaStage=w=>{ let k=0; AREA_ST.forEach((a,i)=>{ if(w>=a.w) k=i; }); return k; };
let BX0=MAPC-8, BX1=MAPC+7;
function announceStage(k){ const st=AREA_ST[k], un=Object.keys(BLD_UNLOCK).filter(b=>BLD_UNLOCK[b]===st.w).map(b=>TOOLDEF[b][1]);
  showOv('<h1>縄張りを広げる</h1><p class="sub">'+st.n+'の普請ができるようになった</p><p style="text-align:center">築城範囲が <b>'+(st.r*2)+'×'+(st.r*2)+'</b> に広がりました。'+(un.length?'<br>新たに <b>'+un.join('・')+'</b> を建てられます。':'')+'<br>必要に応じて曲輪を増やし、守りを固めましょう。</p><button id="stok">普請へ</button>');
  document.getElementById('stok').onclick=()=>{ hideOv(); fit(); buildTools(); ui(); }; }
function setArea(){ const st=AREA_ST[areaStage(S.wave+1)], b0=MAPC-st.r, b1=MAPC+st.r-1; if(b0!==BX0||b1!==BX1){ BX0=b0; BX1=b1; mapDirty=true; } }
const BUF=9;                                     // その外側6マスは緩衝地帯（築城も陣張りも不可）。さらに外側が敵陣の土地
const inBuf=(x,y)=>!isBuildF(x,y)&&x>=BX0-BUF&&x<=BX1+BUF&&y>=BX0-BUF&&y<=BX1+BUF;
function isBuildF(x,y){return x>=BX0&&x<=BX1&&y>=BX0&&y<=BX1;}
let ROADS=[[0,FB1+7],[COLS-1,FB1+7]];           // 街道入口（兵糧奉行が兵糧を受け取る場所）。2か所は初めから街道で繋がっている（genKaido）
const isBuild=(x,y)=>x>=BX0&&x<=BX1&&y>=BX0&&y<=BX1;
const GR=0, MD=1, MT=2, SL=3;     // 地形ブロック：通常地面・盛土・堀・坂
const COST={mound:5,moat:4,slope:5,stone:2,dobei:4,gate:20,bridge:8,yagura:30,tamon:45,goten:60,annex:40,yashiki:35,kura:25,road:2,rouka:3};
const BLK={goten:1,annex:1,yashiki:1,kura:1,rouka:1};     // 御殿・屋敷・蔵：マスを塞ぐ（誰も通れない）・火を放たれる
const BSIZE={goten:[3,4],annex:[2,3],yashiki:[3,4],kura:[1,1]};   // 幅×奥行（「向き」で入れ替え）
const FIRE_T=6, ROAD_MUL=1.4, UNLOCK={spr:1,gun:2,cav:3};   // 火が付くまでの秒（敵1人あたり）・道の速さ・増築の数で解放される兵
const MAXLV=5;   // 盛土・山の最大の段数
const DIRV={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};   // 坂：高い側の向き
const SENSE=2.5;      // 守り兵の感知範囲
const GATE_HP=260;
// 門の種類：薬医門（安い・弱い）／高麗門（標準）／櫓門（高い・堅い・上の櫓から矢を射る）
const GATE_T={yakui:{n:'薬医門',hp:170,cost:12},korai:{n:'高麗門',hp:260,cost:20},yagura:{n:'櫓門',hp:460,cost:75}};
const gateType=gt=>GATE_T[gt.type||'korai'];
const TEN={1:{cost:60,hp:250,rng:3,dmg:6,cd:1.2},2:{cost:180,hp:600,rng:4,dmg:9,cd:1.0},3:{cost:400,hp:1100,rng:5,dmg:13,cd:.8}};
const UT={
  inf:{n:'歩兵',c:'歩',cost:10,hp:75,dmg:8,rng:1.15,cd:.8,col:'#3460c0',mob:1,leash:6,spd:1.7},
  spr:{n:'槍兵',c:'槍',cost:15,hp:80,dmg:9,rng:1.6,cd:.95,col:'#23805e',mob:1,leash:6,spd:1.5},
  arc:{n:'弓兵',c:'弓',cost:20,hp:40,dmg:7,rng:2.2,cd:1.0,col:'#a86e1e',ranged:1,spd:1.6},
  gun:{n:'鉄砲兵',c:'鉄',cost:35,hp:40,dmg:30,rng:1.8,cd:2.6,col:'#3a3a3a',ranged:1,spd:1.5},
  cav:{n:'騎馬兵',c:'騎',cost:30,hp:110,dmg:15,rng:1.15,cd:.8,col:'#7c35a8',mob:1,leash:9,spd:3.2},
};
const ET={
  ash:{n:'足軽',c:'足',hp:45,spd:1.0,dmg:6,sdmg:6,cd:1.0,bounty:5,routP:.6},
  cav:{n:'騎馬武者',c:'騎',hp:70,spd:2.0,dmg:10,sdmg:3,cd:.9,bounty:9,routP:.5,horse:1},
  arc:{n:'弓足軽',c:'弓',hp:34,spd:.95,dmg:5,sdmg:3,cd:1.2,bounty:7,routP:.65,rng:2.5},
  gun:{n:'鉄砲足軽',c:'砲',hp:32,spd:.9,dmg:12,sdmg:3,cd:2.6,bounty:8,routP:.65,rng:2,gun:1},
  spr:{n:'槍足軽',c:'槍',hp:55,spd:.95,dmg:8,sdmg:5,cd:1.1,bounty:7,routP:.55},
  lad:{n:'梯子足軽',c:'梯',hp:40,spd:.9,dmg:5,sdmg:4,cd:1.0,bounty:8,routP:.6},
  bam:{n:'竹束',c:'竹',hp:110,spd:.6,dmg:5,sdmg:12,cd:1.2,bounty:12,routP:.3,shield:.4},
  boss:{n:'陣大将',c:'将',hp:320,spd:.8,dmg:14,sdmg:0,cd:1.0,bounty:40,routP:0},
};
// ===== 出陣部隊（野戦と同じ、家臣の侍大将が率いる部隊） =====

function applyTune(){
  for(const k in UT){ const b=BASE_T.UT[k]; UT[k].hp=Math.round(b.hp*TUNE.uHp); UT[k].dmg=b.dmg*TUNE.uDmg; if(b.rng) UT[k].rng=+(b.rng*TUNE.uRng).toFixed(2); }

function setLv(x,y,lv){const t=tile(x,y); if(lv>0){t.t=MD;t.lv=lv;t.natLv=lv;} else {t.t=GR;t.lv=0;t.natLv=0;} t.dir=null; t.natSl=false;}
const lvAt=(x,y)=>{const t=tile(x,y); return !t?0:t.t===MD?t.lv:0;};
function carveRamp(x,y,dx,dy){ // 頂から外へ歩き、段が下がる所に元からの坂を置く
  const dir=dx===1?'l':dx===-1?'r':dy===1?'u':'d'; let prev=lvAt(x,y);
  for(let s=0;s<14&&prev>0;s++){ x+=dx;y+=dy; if(!inb(x,y)) break; let lv=lvAt(x,y);
    if(lv<prev){ if(prev-lv>1){ setLv(x,y,prev-1); lv=prev-1; }
      if(lv>0&&inb(x+dx,y+dy)&&lvAt(x+dx,y+dy)<lv&&tile(x+dx,y+dy).t!==SL) setLv(x+dx,y+dy,lv);   // 坂の下に踊り場を作る（段が細い所でも坂がつながる）
      if(lvAt(x+dx,y+dy)===lv||(lv===0&&tile(x+dx,y+dy)&&tile(x+dx,y+dy).t===GR)){ const t=tile(x,y); t.under=lv>0?{lv,nat:lv}:null; t.t=SL; t.dir=dir; t.lv=0; t.natLv=0; t.natSl=true; }
      prev=lv; } }
}
// 川：築城範囲の外（西か東）を南北に蛇行して流れる。敵は渡れるが足が鈍る（堀と同じ）。街道とは橋で交わる
function genRiver(){
  const side=Math.random()<.5?-1:1, base=side<0?FB0-BUF:FB1+BUF, p1=Math.random()*6, p2=Math.random()*6; S.river={side,base,p1,p2};
  for(let y=0;y<ROWS;y++){ const c=base+3.2*Math.sin(y/10+p1)+1.5*Math.sin(y/4.6+p2), x0=Math.round(c-1.6), x1=Math.round(c+1.6);
    for(let x=x0;x<=x1;x++){ if(!inb(x,y)||isBuildF(x,y)) continue; const t=tile(x,y); t.t=MT; t.lv=0; t.natLv=0; t.river=true; } }
}

    for(let yy=Math.min(py,y);yy<=Math.max(py,y);yy++){ const t=tile(x,yy); if(!t) continue; t.road='kaido'; if(t.t===MD){ t.t=GR; t.lv=0; t.natLv=0; } if(t.t===MT){ t.br=(yy===y&&py===y)?'h':(py!==y?'v':'h'); t.natBr=true; } }

// 自然な山：等高線ごとに「角度で揺らぐ半径」を持たせ、上の段ほど中心を少しずらす（片側は急、反対は緩やか）。

const HILL_P={ // L：段数、R：各段の外周半径（下の段から）、asp：縦横比、amp：揺らぎ、sh：段ごとの中心のずれ（最初の築城範囲16×16に収まる大きさ）

  steep:{L:5,R:[5.2,4.2,3.2,2.2,1.2],asp:1,amp:.16,sh:.3}, skew:{L:4,R:[5.5,4.1,2.8,1.5],asp:1.1,amp:.26,sh:.8}, long:{L:3,R:[6.0,4.2,2.4],asp:1.6,amp:.2,sh:.45}};
function genHill(type){

  const L=new Uint8Array(N); for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++) L[idx(x,y)]=lvAtXY(x,y);

    for(const[dx,dy]of N4){ const w=L[idx(x+dx,y+dy)]; if(w>v) up++; else if(w<v) dn++; }
    if(up>=3) L[i]=Math.min(...N4.map(([dx,dy])=>L[idx(x+dx,y+dy)]).filter(w=>w>v)); else if(dn>=3) L[i]=Math.max(...N4.map(([dx,dy])=>L[idx(x+dx,y+dy)]).filter(w=>w<v)); }
  // 段と段の間に必ず1マス以上の帯を残す（2段の崖を作らない＝どの段も一続き）
  for(let it=0,ch=true;ch&&it<8;it++){ ch=false; for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){ const i=idx(x,y), v=L[i]; if(v<2) continue;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++) if(L[idx(x+dx,y+dy)]<v-1){ L[i]=v-1; ch=true; dy=2; break; } } }
  for(let i=0;i<N;i++) if(L[i]) setLv(i%COLS,(i/COLS)|0,L[i]);
  // 頂から坂を通す：南向き（大手）＋大きな山は反対側にも（搦手）
  let pk=[Math.round(cx),Math.round(cy)], best=-1; for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ const v=L[idx(x,y)]; if(v>best||(v===best&&dd2(x,y,cx,cy)<dd2(pk[0],pk[1],cx,cy))){best=v;pk=[x,y];} }
  carveRamps(pk,1); if(P.L>=3) carveRamps(pk,-1);

}
// 自然の坂：頂から一段ずつ、段の縁に坂を1マス置いて下っていく（山の形は変えない）。sy=1なら最後は南（大手）、-1なら北（搦手）へ寄せる
function carveRamps(pk,sy){
  const DIRK={'0,-1':'u','0,1':'d','-1,0':'l','1,0':'r'}; let prev=[pk[0],pk[1]], top=lvAt(pk[0],pk[1]);
  const plain=(x,y)=>{ const t=tile(x,y); return t&&t.t!==SL&&t.t!==MT&&!t.road; };
  for(let k=top;k>=1;k--){ let best=null,bs=1e9;
    for(let pass=0;pass<2&&!best;pass++)
    for(let y=MAPC-12;y<=MAPC+12;y++)for(let x=MAPC-12;x<=MAPC+12;x++){ if(!plain(x,y)||lvAt(x,y)!==k-1) continue;
      if(k===1&&Math.max(Math.abs(x+.5-MAPC),Math.abs(y+.5-MAPC))>AREA_ST[0].r-1.5) continue;   // 一番下の坂は最初の築城範囲の内側に
      let near=false; for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ const t=tile(x+dx,y+dy); if(t&&t.t===SL&&(pass===0||(dx===0||dy===0))) near=true; } if(near) continue;
      for(const[dx,dy]of N4){ if(!plain(x+dx,y+dy)||lvAt(x+dx,y+dy)!==k||!plain(x-dx,y-dy)||lvAt(x-dx,y-dy)!==k-1) continue;
        const sc=Math.hypot(x-prev[0],y-prev[1])-(sy*(y-MAPC))*(k===1?1.2:.35)+Math.random()*.8; if(sc<bs){bs=sc;best=[x,y,dx,dy];} } }
    if(!best) continue; const[x,y,dx,dy]=best, t=tile(x,y);

}
// 城の外の小さな丘や林（地形の変化）。川・街道の位置とは後で調整される
function genKnolls(){
  const n=5+(Math.random()*4|0);

// ================= 辺 =================
function edgeOf(x,y,dx,dy){

const ekey=e=>(e.v?'v':'h')+e.i;

const dobeiAt=e=>(e.v?DV:DH)[e.i];
function setDobeiRaw(e,val){(e.v?DV:DH)[e.i]=val;}
// 天端（crest）：同じ高さの辺、または段差の上の縁。土塀を置ける。法面（face）：段差の面。石垣を置ける
// 土塀を置ける辺（天端）：坂の入口・出口と門は不可
function dobeiOK(e){

    if(isTowerT(A)||isTowerT(B)) return false; }   // 櫓・多聞櫓のマスの縁には塀を置かない（櫓が塀の役目をする）
  if(!inb(ax,ay)||!inb(bx,by)||!isBuild(ax,ay)||!isBuild(bx,by)) return false;
  if(S.gates.has(ekey(e))) return false;
  const dx=bx-ax,dy=by-ay; if(isSlopeEnd(ax,ay,dx,dy)||isSlopeEnd(bx,by,-dx,-dy)) return false;
  const a=tile(ax,ay),b=tile(bx,by); if(a.t===MT&&b.t===MT) return false;

}
const isTowerT=t=>!!t&&(t.obj==='yagura'||t.obj==='tamon');
function clearDobeiAround(x,y){ for(const[dx,dy]of N4){ if(!inb(x+dx,y+dy)) continue; const e=edgeOf(x,y,dx,dy); if(dobeiAt(e)){ setDobeiRaw(e,0); S.gold+=COST.dobei; } } }   // 櫓を建てたらその縁の塀は外す（返金）
function nearDobei(x,y){ for(const[dx,dy]of N4) if(inb(x+dx,y+dy)&&dobeiAt(edgeOf(x,y,dx,dy))) return true; return false; }
function edgeTiles(e){
  if(e.v){const x=e.i%(COLS+1),y=Math.floor(e.i/(COLS+1));return [[x-1,y],[x,y]];}
  const x=e.i%COLS,y=Math.floor(e.i/COLS);return [[x,y-1],[x,y]];
}
function edgeGeom(e){
  if(e.v){const x=e.i%(COLS+1),y=Math.floor(e.i/(COLS+1));return [x,y,x,y+1];}
  const x=e.i%COLS,y=Math.floor(e.i/COLS);return [x,y,x+1,y];
}
// 標高
function hFlat(t){return t.t===MD?t.lv:t.t===MT?-1:0;}
function slopeLow(x,y,dep){
  const t=tile(x,y),[dx,dy]=DIRV[t.dir],nb=tile(x-dx,y-dy);
  if(!nb||(dep||0)>8) return 0;
  return nb.t===SL?slopeLow(x-dx,y-dy,(dep||0)+1)+.5:hFlat(nb);
}
function tileH(x,y){const t=tile(x,y);return t.t===SL?slopeLow(x,y)+.5:hFlat(t);}

// 坂の入口・出口の辺か
function isSlopeEnd(x,y,dx,dy){const t=tile(x,y); if(!t||t.t!==SL) return false; const[a,b]=DIRV[t.dir]; return (dx===a&&dy===b)||(dx===-a&&dy===-b);}

  const[[ax,ay],[bx,by]]=edgeTiles(e);

  const dx=bx-ax,dy=by-ay;
  if(isSlopeEnd(ax,ay,dx,dy)||isSlopeEnd(bx,by,-dx,-dy)) return false;

function pickEdge(wx,wy){

}
function pickDobeiEdge(wx,wy){
  const tx=Math.floor(wx),ty=Math.floor(wy),fx=wx-tx,fy=wy-ty;
  const c=[[fx,-1,0],[1-fx,1,0],[fy,0,-1],[1-fy,0,1]].sort((a,b)=>a[0]-b[0]);
  for(const[,dx,dy]of c){const e=edgeOf(tx,ty,dx,dy); if(dobeiOK(e)&&!dobeiAt(e)) return e;}
  return null;
}
function pickStoneEdge(wx,wy){
  const tx=Math.floor(wx),ty=Math.floor(wy),fx=wx-tx,fy=wy-ty;
  const c=[[fx,-1,0],[1-fx,1,0],[fy,0,-1],[1-fy,0,1]].sort((a,b)=>a[0]-b[0]);
  for(const[,dx,dy]of c){const e=edgeOf(tx,ty,dx,dy); if(eligible(e)&&!stoneAt(e)&&!S.gates.has(ekey(e))) return e;}

function cleanStones(x,y){

}
function cleanAround(x,y){
  cleanStones(x,y);
  for(const[dx,dy]of N4){const nx=x+dx,ny=y+dy; if(inb(nx,ny)) cleanStones(nx,ny);}
}

// ================= 通行判定 =================
// 誰でも：同じ高さか0.5差（坂）なら移れる。1段差は越えられない。橋はその向きなら高さを無視して渡れる。
// mode: enemy(閉門は攻撃して通る) / block(閉門は通れない) / seal(門は全て閉) / open(門は全て開) / supply(門は通れる・堀は不可)
function step(ax,ay,dx,dy,mode){
  const bx=ax+dx,by=ay+dy; if(!inb(bx,by)) return Infinity;
  const a=G[idx(ax,ay)], b=G[idx(bx,by)];

  const hor=dx!==0;
  const brA=!!a.br&&(a.br==='h')===hor;
  const brB=!!b.br&&(b.br==='h')===hor;

  const foe=mode==='enemy'||mode==='seal'||mode==='open'||mode==='eblock'||mode==='ladder';

    if(mode==='ladder') return Infinity;   // 梯子足軽は門を通らない
    if(!g.open&&mode!=='open'&&mode!=='supply'){ if(mode==='enemy') extra=6; else return Infinity; }
  }else if(!g&&(stoneAt(e)||dobeiAt(e))&&!(brA||brB)){
    // 石垣・土塀は梯子が掛かっていれば敵が越えられる。梯子足軽はそこに梯子を掛けに行く（櫓・多聞櫓・天守のマスには掛けられない）
    const tower=b.obj==='yagura'||b.obj==='tamon'||b.obj==='ten';
    if(foe&&S.ladders&&S.ladders.has(ek)&&!tower) over=true;
    else if(mode==='ladder'&&!tower){ over=true; extra=10; }
    else return Infinity;
  }
  let c=1;

    const ha=brA?0:(a.t===MT&&!a.br)?-1:tileH(ax,ay), hb=tileH(bx,by);
    const diff=Math.abs(ha-hb);
    if(diff>.51){

      if(foe&&!g&&((!stoneAt(e)&&!dobeiAt(e))||over)&&diff<=1.01) c=hb>ha?6:2;
      else return Infinity;

const isBorder=(x,y)=>x===0||y===0||x===COLS-1||y===ROWS-1;
function bfs(srcs,mode){
  const vis=new Uint8Array(N),q=[];
  for(const i of srcs){ if(!vis[i]){vis[i]=1;q.push(i);} }
  for(let h=0;h<q.length;h++){const i=q[h],x=i%COLS,y=(i/COLS)|0;
    for(const[dx,dy]of N4){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(vis[j])continue;
      if(step(x,y,dx,dy,mode)<Infinity){vis[j]=1;q.push(j);}}}

}
// 二分ヒープ版ダイクストラ（終点からの逆向き）
const HD=new Float64Array(N*8), HI=new Int32Array(N*8); let hn=0, popD=0;
function hpush(d,i){let k=hn++;while(k>0){const p=(k-1)>>1;if(HD[p]<=d)break;HD[k]=HD[p];HI[k]=HI[p];k=p;}HD[k]=d;HI[k]=i;}

  while(hn>0){const u=hpop(),du=popD; if(du>out[u]) continue;
    const ux=u%COLS,uy=(u/COLS)|0;
    for(const[dx,dy]of N4){const vx=ux-dx,vy=uy-dy;if(!inb(vx,vy))continue;const v=idx(vx,vy);
      const nd=du+step(vx,vy,dx,dy,mode); if(nd<out[v]){out[v]=nd;hpush(nd,v);}}}

function borderList(enemyOnly){

    if(!isBorder(x,y)) continue;
    if(enemyOnly&&!(y===0||((x===0||x===COLS-1)&&y<ROWS*.65))) continue;
    if(!G[idx(x,y)].obj) r.push(idx(x,y));
  }

}
function calcTenAdj(){

  for(let yy=y;yy<y+n;yy++)for(let xx=x;xx<x+n;xx++)for(const[dx,dy]of N4){
    const nx=xx+dx,ny=yy+dy; if(!inb(nx,ny))continue; const j=idx(nx,ny); if(G[j].obj==='ten') continue;

function supplyOK(){

function recompute(){

  const dx=bx-ax,dy=by-ay; const ok=(x,y,a,b)=>step(x,y,a,b,m||'block')<Infinity;

function trailPoint(gr,dist){

  for(const[qx,qy]of tr){ const l=Math.hypot(qx-px,qy-py); if(acc+l>=dist){const t=(dist-acc)/(l||1); return [px+(qx-px)*t,py+(qy-py)*t];} acc+=l; px=qx;py=qy; }
  return [px,py];
}
function memberTarget(gr,u,i){
  const[sx_,sy_]=slotPos(gr,u);
  if(inb(Math.floor(sx_),Math.floor(sy_))&&lineWalk(gr.tai.x,gr.tai.y,sx_,sy_,u.mm)) return [sx_,sy_];
  return trailPoint(gr,(i+1)*.6);
}
function enemiesNear(path){ let n=0; for(let i=0;i<path.length;i+=2){const[px,py]=path[i]; for(const e of S.enemies) if(!e.dead&&dd2(e.x,e.y,px,py)<3) n++;} return n; }
function bugyoAuto(gr,t,dt){ // 自動往復：見張りの少ない街道を選んで往復する
  if(gr.load){ if(gr.autoState!=='back'){gr.autoState='back'; gr.dest=kuraDest()||[t.hx,t.hy]; gr.goalChanged=true;} return; }
  if(S.supply>=95){ if(gr.autoState!=='idle'){gr.autoState='idle'; gr.dest=[t.hx,t.hy]; gr.goalChanged=true;} return; }
  gr.autoT=(gr.autoT||0)-dt;
  if(gr.autoState!=='out'||gr.autoT<=0){
    let best=null,bv=Infinity;
    for(const[rx,ry]of ROADS){ const path=findPathC(t.x,t.y,rx+.5,ry+.5,'supply'); if(!path.length) continue;
      const last=path[path.length-1]; if(dd2(last[0],last[1],rx+.5,ry+.5)>1.5) continue;
      const v=path.length+6*enemiesNear(path); if(v<bv){bv=v;best=[rx+.5,ry+.5];} }
    if(best){ gr.autoState='out'; gr.dest=best; gr.goalChanged=true; } gr.autoT=4;
  }
}
function updGroupC(gi,dt){
  const gr=S.groups[gi], t=gr.tai; if(!t||t.dead) return;
  // 兵糧奉行：街道入口で受け取り、城内で引き渡す
  if(gr.bugyo){
    const nl=members(gi).filter(m=>m.k==='nida'&&!m.rout).length;
    if(!gr.load&&ROADS.some(([rx,ry])=>dd2(t.x,t.y,rx+.5,ry+.5)<2)){ gr.loadT+=dt; if(gr.loadT>=3){gr.load=nl;gr.loadT=0;toast('兵糧を受け取った（荷駄'+nl+'台）。城内へ運べ');} }
    else if(!gr.load) gr.loadT=0;
    if(gr.load&&nearKura(t.x,t.y)){ const add=12*Math.min(gr.load,Math.max(1,nl)); S.supply=Math.min(100,S.supply+add); toast((gr.convoy?'荷駄隊が蔵に着いた！':'兵糧が届いた！')+'兵站+'+add); gr.load=0;
      if(gr.convoy){ S.army=S.army.filter(u=>u.g!==gi); gr.tai=null; gr.dest=null; gr.steer=null; if(S.sel===gi) S.sel=0; buildTools(); return; } }
    if(gr.auto&&!gr.steer){ if(gr.convoy){ gr.autoT=(gr.autoT||0)-dt; if(gr.autoT<=0){ gr.dest=kuraDest(); gr.goalChanged=true; gr.autoT=4; } } else bugyoAuto(gr,t,dt); }
    // 自分の門：奉行の一行が近づいたら開け、通り過ぎて3秒経ったら閉める
    const crew=[t,...members(gi)];
    for(const[k,g] of S.gates){ if(g.broken) continue; const[x1,y1,x2,y2]=edgeGeom(kedge(k)), mx=(x1+x2)/2, my=(y1+y2)/2;
      const near=crew.some(u=>dd2(u.x,u.y,mx,my)<1.6);
      if(!g.open&&(gr.dest||gr.steer)&&crew.some(u=>dd2(u.x,u.y,mx,my)<.8)){ g.open=true; g.byB=true; g.acT=3; S.flowDirty=true; }
      if(g.byB){ if(near) g.acT=3; else { g.acT-=dt; if(g.acT<=0){ g.open=false; g.byB=false; S.flowDirty=true; } } } }
  }
  const goal=gr.steer||gr.dest; if(!goal) return;
  const M=t.mm;
  // 配下の近接兵が残っている間は、大将は敵に向かって先に出ない（前の敵とは配下が斬り合う）
  const melee=members(gi).filter(m=>!m.rout&&MELEE(m.k));
  if(!gr.bugyo){ const foe=nearestEnemy(t.x,t.y,melee.length?2.4:1.3,e=>lineWalk(t.x,t.y,e.x,e.y,M));
    if(foe){ const gx=goal[0]-t.x, gy=goal[1]-t.y, fx=foe.x-t.x, fy=foe.y-t.y; if(gx*fx+gy*fy>0||!gr.steer) return; } }
  gr.pathT-=dt;
  const PM=t.pm||M;
  if(gr.pathT<=0||gr.goalChanged){gr.path=lineWalk(t.x,t.y,goal[0],goal[1],PM)?[[goal[0],goal[1]]]:findPathC(t.x,t.y,goal[0],goal[1],PM);gr.pathT=gr.steer?.25:1.5;gr.goalChanged=false;}
  smooth(t.x,t.y,gr.path,PM);
  if(!gr.path.length){ if(!gr.steer) gr.dest=null; return; }
  const[px,py]=gr.path[0], vx=px-t.x, vy=py-t.y, l=Math.hypot(vx,vy);
  if(l>.05){ const f=gr.face,a=Math.min(1,dt*4); let fx=f[0]+(vx/l-f[0])*a, fy=f[1]+(vy/l-f[1])*a; const fl=Math.hypot(fx,fy)||1; gr.face=[fx/fl,fy/fl]; }
  // 配下が遅れすぎたら少し待つ（待ちすぎない）
  let lag=0; members(gi).forEach((m,i)=>{ if(m.rout) return; const[a,b]=memberTarget(gr,m,i); lag=Math.max(lag,dd2(m.x,m.y,a,b)); });
  gr.waitT=lag>3?(gr.waitT||0)+dt:0;
  let flag=0; melee.forEach(m=>{ const[a,b]=memberTarget(gr,m,members(gi).indexOf(m)); flag=Math.max(flag,dd2(m.x,m.y,a,b)); });
  const slow=(flag>1.5&&nearestEnemy(t.x,t.y,5)?.3:1)*(lag>3&&gr.waitT<2.5?.45:1);   // 敵が近い時は、前列が出るまで大将は進まない
  if(moveTowardC(t,px,py,grpSpeed(gi)*slow,dt)||dd2(t.x,t.y,px,py)<.1) gr.path.shift();
  const tr=gr.trail||(gr.trail=[]); if(!tr.length||dd2(tr[0][0],tr[0][1],t.x,t.y)>.3){ tr.unshift([t.x,t.y]); if(tr.length>80) tr.pop(); }
  if(!gr.path.length&&!gr.steer) gr.dest=null;
}
function updArmy(u,dt){
  const d=aStat(u.k), gr=S.groups[u.g]; u.cd-=dt;
  if(u.rout){ goToC(u,u.hx,u.hy,d.spd*1.1,dt); return; }
  const wet=u.k==='gun'&&S.rain;
  if(d.dmg&&u.cd<=0&&!wet){
    const sh=unitH(u);
    const e=d.ranged?nearestEnemy(u.x,u.y,d.rng,e=>!sheltered(e)&&canShoot(u.x,u.y,sh,e.x,e.y,enemyH(e)))
                   :nearestEnemy(u.x,u.y,d.rng,e=>u.k==='spr'||connected(Math.floor(u.x),Math.floor(u.y),Math.floor(e.x),Math.floor(e.y)));
    if(e){hitE(u,e);u.cd=d.cd;}
  }
  if(u.isTai) return;
  if(!gr.tai){ goToC(u,u.hx,u.hy,d.spd,dt); return; }
  const mi=members(u.g).indexOf(u);
  const[sx_,sy_]=memberTarget(gr,u,mi), mul=gr.form==='chouda'?1.3:1;
  if(d.dmg&&!d.ranged){
    const e=nearestEnemy(u.x,u.y,SENSE,e=>dd2(e.x,e.y,sx_,sy_)<3.2&&lineWalk(u.x,u.y,e.x,e.y,u.mm));
    if(e){ if(dd2(u.x,u.y,e.x,e.y)>d.rng*.85) goToC(u,e.x,e.y,d.spd*mul,dt); return; }
  }else if(d.ranged){
    const sh=unitH(u); const e=nearestEnemy(u.x,u.y,d.rng,e=>canShoot(u.x,u.y,sh,e.x,e.y,enemyH(e)));
    if(e&&dd2(u.x,u.y,sx_,sy_)<1.6) return;
  }
  goToC(u,sx_,sy_,d.spd*mul,dt);
}
function separateEnemies(dt){
  const es=S.enemies.filter(e=>!e.dead&&!e.atk&&e.k!=='boss'), k=Math.min(1,dt*10); es.sort((a,b)=>a.x-b.x); // x順に並べて掃引（O(n log n)）
  const ar=S.army.filter(u=>!u.dead);
  for(let i=0;i<es.length;i++){ const a=es[i];
    for(let j=i+1;j<es.length;j++){ const b=es[j], dx=b.x-a.x, dy=b.y-a.y; if(dx>.6) break; if(Math.abs(dx)>.5||Math.abs(dy)>.5) continue; const d=Math.hypot(dx,dy);
      if(d<.5&&d>1e-4){ const p=Math.min((.5-d)*.5,.6*dt), px=dx/d*p, py=dy/d*p;   // 押し合いは歩みより弱く（すれ違える）
        // 陣の兵は進軍する兵に道を譲る（譲る側だけが動く）
        const ma=a.guard&&!b.guard?2:b.guard&&!a.guard?0:1, mb=2-ma;
        if(ma&&canPassC(a.x,a.y,a.x-px*ma,a.y-py*ma)){a.x-=px*ma;a.y-=py*ma;}
        if(mb&&canPassC(b.x,b.y,b.x+px*mb,b.y+py*mb)){b.x+=px*mb;b.y+=py*mb;} } }
    for(const u of ar){ const dx=a.x-u.x, dy=a.y-u.y; if(dx>.45||dx<-.45||dy>.45||dy<-.45) continue; const d=Math.hypot(dx,dy);
      if(d<.45&&d>1e-4){ const p=Math.min(.45-d,1.2*dt), px=dx/d*p, py=dy/d*p; if(canPassC(a.x,a.y,a.x+px,a.y+py)){a.x+=px;a.y+=py;} } } }
}
function separateArmy(dt){
  const us=S.army.filter(u=>!u.dead);
  for(let i=0;i<us.length;i++)for(let j=i+1;j<us.length;j++){
    const a=us[i],b=us[j], dx=b.x-a.x, dy=b.y-a.y; if(dx>.5||dx<-.5||dy>.5||dy<-.5) continue; const d=Math.hypot(dx,dy);
    if(d<.5&&d>1e-4){ const p=(.5-d)*.5*Math.min(1,dt*10), px=dx/d*p, py=dy/d*p;
      if(canPassC(a.x,a.y,a.x-px,a.y-py)){a.x-=px;a.y-=py;} if(canPassC(b.x,b.y,b.x+px,b.y+py)){b.x+=px;b.y+=py;} }
  }
}
function updGateTowers(dt){
  for(const[k,gt] of S.gates){ if((gt.type||'korai')!=='yagura'||gt.broken) continue; gt.cd=(gt.cd||0)-dt; if(gt.cd>0) continue;
    const T=GATE_T.yagura, [x1,y1,x2,y2]=edgeGeom(kedge(k)), cx=(x1+x2)/2+(x1===x2?0:0), cy=(y1+y2)/2, e=kedge(k), [[ax,ay],[bx,by]]=edgeTiles(e);
    const sh=Math.max(inb(ax,ay)?tileH(ax,ay):0,inb(bx,by)?tileH(bx,by):0)+1;
    const en=nearestEnemy(cx,cy,T.rng,f=>!sheltered(f)&&canShoot(cx,cy,sh,f.x,f.y,enemyH(f)));
    if(en){ en.hp-=T.dmg*(ET[en.k].shield||1)*(inMoat(en)?1.5:1); S.fx.push({type:'arrow',x1:cx,y1:cy,x2:en.x,y2:en.y,t:.2}); routCheck(en); killCheck(en,false); gt.cd=T.cd; }
    else gt.cd=.3; }
}
function updTen(dt){
  const t=S.ten; if(!t) return; t.cd-=dt; if(t.cd>0) return;
  const st=TEN[t.n], cx=t.x+t.n/2, cy=t.y+t.n/2, sh=tileH(t.x,t.y)+2;
  const e=nearestEnemy(cx,cy,st.rng+t.n/2-.5,e=>!sheltered(e)&&canShoot(cx,cy,sh,e.x,e.y,enemyH(e)));

    S.fx.push({type:'arrow',x1:cx,y1:cy,x2:e.x,y2:e.y,t:.2}); routCheck(e); killCheck(e,false); t.cd=st.cd; }

function update(dt){
  if(S.phase!=='battle'||S.over) return;
  // 敵は塊（組）で来る。陣が進むほど組が大きい
  // 各陣から組になって、わらわらと攻めてくる
  S.camps.forEach((c,ci)=>{ if(c.dead||!c.q.length) return; c.t-=dt; if(c.t>0) return;
    const n=Math.min(c.q.length,squadSize(S.wave)), gk=pickGate(c), ks=[];
    for(let j=0;j<n;j++) ks.push(c.q.pop());
    // 梯子足軽を含む組は「梯子組」：梯子足軽が先頭に立ち、足軽・槍足軽・弓足軽を連れて虎口を避けて石垣・土塀へ向かう
    const lsq=ks.includes('lad');
    if(lsq){ for(let j=ks.length-1;j>=0;j--) if(ks[j]==='bam'||ks[j]==='cav'){ c.q.unshift(ks[j]); ks.splice(j,1); }
      let a=0; for(let j=0;j<ks.length;j++) if(ks[j]==='ash'&&(a++)%2===1) ks[j]='spr';
      ks.sort((a,b)=>(a==='lad'?-1:b==='lad'?1:E_ORDER[a]-E_ORDER[b])); }
    else ks.sort((a,b)=>E_ORDER[a]-E_ORDER[b]);
    const fm=pickFormE(ks), o=S.og.find(o=>o.k===gk); let hd=[0,1];
    if(o){ const vx=o.ox-c.x, vy=o.oy-c.y, l=Math.hypot(vx,vy)||1; hd=[vx/l,vy/l]; }
    const sq={id:Math.random(),leader:null,form:fm,lad:lsq};
    ks.forEach((k,j)=>{ const e=spawnAt(k,ci,'assault',c.x,c.y); e.sq=sq; e.gk=gk; e.slot=FORM_E[fm].s[j%9]; e.hd=hd.slice();
      if(lsq){ e.assault=true; if(k==='lad') e.ladder=true; else e.lfol=true; }
      if(j===0) sq.leader=e; else { const[p,q]=slotXY(sq.leader,e); if(canPassC(e.x,e.y,p,q,'block')){e.x=p;e.y=q;} } });
    c.t=Math.max(3,4.5-.1*S.wave)*(.85+Math.random()*.3); });
  // 陣の守り（8人）と包囲兵は討たれても補充される
  S.camps.forEach((c,ci)=>{ if(c.dead||!c.respawn||!c.respawn.length) return; for(const r of c.respawn) r.t-=dt;
    for(const r of c.respawn.filter(r=>r.t<=0)){ if(r.cg!=null) spawnCampGuard(r.k,ci,r.cg); else if(S.mode==='siege'){ const e=spawnAt(r.k,ci,'guard',r.post[0],r.post[1]); e.px=r.post[0]; e.py=r.post[1]; e.post=r.post; } }
    c.respawn=c.respawn.filter(r=>r.t>0); });
  S.flowT-=dt; if(S.flowDirty&&S.flowT<=0){ recompute(); S.flowDirty=false; S.flowT=.3; }   // 門の開閉など、通り道が変わった時だけ計算し直す
  updTen(dt);
  if(S.mode==='siege'&&S.convoys.length&&S.siegeT<=S.convoys[0]){ S.convoys.shift(); spawnConvoy(); }
  S.groups.forEach((g,i)=>{ if(!g.idle) updGroupC(i,dt); });
  for(const u of S.army) if(!u.dead&&!u.idle&&!S.groups[u.g].idle) updArmy(u,dt);
  separateArmy(dt);
  separateEnemies(dt);
  for(const u of S.units) if(!u.dead) updUnit(u,dt);
  for(const e of S.enemies) if(!e.dead) updEnemy(e,dt);
  updFire(dt);
  S.units=S.units.filter(u=>!u.dead);
  S.army=S.army.filter(u=>!u.dead);
  S.enemies=S.enemies.filter(e=>!e.dead);
  if(S.mode==='siege'){
    S.siegeT-=dt; S.supply-=.5*dt; if(S.siegeT<=0){ toast('敵は包囲を解いた！'); return endWave(); } }
  else if(S.supOK){ S.supply-=.15*dt; S.warned=false; }
  else { S.supply-=.8*dt; if(!S.warned){S.warned=true;toast('兵站の道が絶たれた！兵站が尽きていく…',3000);} }
  if(TUNE.god){ if(S.ten.hp<1) S.ten.hp=1; if(S.supply<1) S.supply=1; }   // テスター：落城しない
  if(S.ten.hp<=0){ S.ten.hp=0; return gameOver(false,'天守に敵が取り付き、落城した。'); }
  if(S.supply<=0){ S.supply=0; return gameOver(false,'兵站が尽き、城兵は飢えて開城した。'); }
  if(S.mode!=='siege'&&S.camps.every(c=>!c.q.length)&&!S.enemies.some(e=>!e.guard)) endWave();
}
function endWave(){
  // 敵の学習：門に与えた損害・破った門は重みが上がり、損害の大きかった虎口は下がる
  for(const k in S.stat){ const st=S.stat[k], old=learnW(k);
    const sc=1+2.2*Math.min(1,st.dmg/GATE_HP)+(st.broke?1.2:0)-.8*(st.sent?st.lost/st.sent:0);
    S.learn[k]=Math.max(.3,Math.min(4,.5*old+.5*sc)); }
  S.enemies=[]; S.camps=[]; for(const b of S.blds) b.fire=0;
  const rw=Math.round((TUNE.rewardBase+TUNE.rewardPer*S.wave)*TUNE.reward); S.gold+=rw;
  S.supply=Math.min(100,S.supply+30);
  S.ten.hp=Math.min(S.ten.max,S.ten.hp+(S.ten.max-S.ten.hp)*.3);
  for(const g of S.gates.values()) if(!g.broken) g.hp=Math.min(g.max,g.hp+(g.max-g.hp)*.5);
  for(const u of S.units){u.hp=u.max;u.x=u.hx+.5;u.y=u.hy+.5;u.tx=u.hx;u.ty=u.hy;u.tgt=null;u.plan=null;}
  // 出陣部隊は元の位置へ。大将を失った部隊は解散（大将は置き直せる）
  S.groups.forEach((g,i)=>{ if(g.lost||g.convoy){ S.army=S.army.filter(u=>u.g!==i); g.lost=false; if(g.convoy) g.tai=null; } g.dest=null; g.steer=null; g.load=0; g.loadT=0; g.autoState=null; g.trail=[]; if(g.bugyo) g.auto=true; });
  for(const u of S.army){u.hp=u.max;u.x=u.hx;u.y=u.hy;u.rout=false;u.rc=false;u.path=[];}
  S.mode='assault';
  S.phase='prep'; S.rain=false; S.nextRain=Math.random()<.4; S.fx=[]; S.shelters=[]; S.ladders=new Set();
  const stPrev=areaStage(S.wave); setArea(); const stNow=areaStage(S.wave+1);
  if(S.tab==='bgrp') S.tab='army'; S.trayOpen=false; buildTools();
  recompute();
  let mk=null,mv=0; for(const o of S.og){const v=learnW(o.k); if(v>mv){mv=v;mk=o.k;}}
  toast('第'+S.wave+'陣を撃退！恩賞'+rw+'両。次は「'+WAVE_NAME[S.wave+1]+'」'+(waveMode(S.wave+1)==='focus'?'（虎口集中攻め）':'')+(S.nextRain?'・雨':'・晴れ')+'。'+(mk&&mv>1.15?'敵は「'+gateName(mk)+'」の虎口を攻め所と見ている':''),4500);
  ui();
  if(stNow>stPrev&&!S.over) setTimeout(()=>announceStage(stNow),400);
}
function repairAll(){
  if(S.phase!=='prep') return; undoPush(undoSnap());
  let n=0,lack=false;
  for(const g of S.gates.values()) if(g.broken){ if(pay(gateType(g).cost)){g.broken=false;g.open=false;g.hp=g.max;n++;} else lack=true; }
  for(const b of S.blds) if(b.burnt){ if(pay(Math.ceil(COST[b.k]/2))){b.burnt=false;b.fire=0;n++;} else lack=true; }
  recompute();
  toast(n?('門・焼けた建物を'+n+'か所修復した'+(lack?'（金不足で一部未修復）':'')):(lack?'金が足りません':'修復が必要な門はありません'));
  ui();
}
function gameOver(win,msg){
  S.over=true; S.phase='over';
  showOv('<h1>'+(win?'勝 利':'落 城')+'</h1><p style="text-align:center">'+msg+'</p>'+
    '<p style="text-align:center">到達：第'+S.wave+'陣 / 討取：'+S.kills+'</p><button id="retry">もう一度築城する</button>');
  document.getElementById('retry').onclick=()=>{hideOv();newGame();fit();buildTools();ui();};
}

function sampleBuild(){

// 石垣の角：2本の石垣が直角に出会う頂点で、外角の欠けと内角の重なりを埋める

      if(PXPASS&&!CAPTURE&&sH&&sV){ const nm=outer?'st_out':'st_in', c=sprCanvas(nm,PALS.stone), o=SPR[nm].o||0;   // 角の部品（左右・上下に反転して使う）
        g.save(); g.translate(X,Y); g.scale(sV,sH); g.drawImage(c,-o,-o); g.restore(); continue; }

}
function stoneCornerDraw(X,Y,sH,sV,dh,dv,w){
      const xa=sV?X:X-w/2, xb=sV?X+sV*w:X+w/2, ya=sH?Y:Y-w/2, yb=sH?Y+sH*w:Y+w/2;
      const rx=Math.min(xa,xb), ry=Math.min(ya,yb), rw=Math.abs(xb-xa), rh=Math.abs(yb-ya);

}
// 土塀の端：直角に出会う土塀があれば、その中心線まで伸ばして角をつなぐ
function dobeiOff(e){ return PXPASS?0:-edgeSide(e)*z*.12; }   // ドットでは辺の真上（段違いのギザギザを出さない）
function dobeiEnd(e,atEnd){ // 局所along座標での端の位置

function drawDobei(e){

      if(!CAPTURE) for(const[atEnd,ae] of [[false,a0],[true,a1]]){ if(ae!==0&&ae!==z){ const c=sprCanvas('db_c',PALS.dobei), cw=c.width, cx=Math.round(atEnd?ae-cw/2:ae+cw/2); g.drawImage(c,Math.round(cx-cw/2),top); } }

// ===== 櫓門（1×3）：両脇の2マスは櫓（obj='yagura'・mon=門の辺）、真ん中のマスの外側の辺が門 =====
function monTiles(cx,cy,dir){ return dir==='h'?[[cx-1,cy],[cx,cy],[cx+1,cy]]:[[cx,cy-1],[cx,cy],[cx,cy+1]]; }
function monCheck(cx,cy,dir){

  for(const[x,y] of ts){ const e=bldFree(x,y); if(e) return e+'（櫓門は1×3）'; }
  const h0=tileH(cx,cy); if(ts.some(([x,y])=>Math.abs(tileH(x,y)-h0)>.01)) return '段差をまたいで建てられません（同じ高さの平らな所に）';
  for(let k=1;k<3;k++){ const[ax,ay]=ts[k-1],[bx,by]=ts[k], e=edgeOf(ax,ay,bx-ax,by-ay); if(stoneAt(e)||S.gates.has(ekey(e))) return '石垣・門をまたいで建てられません'; }

// 門の絵（局所座標：along=0..z が門の幅、across の + 側が城の内側）

  const doors=(v)=>{ if(gt.open){ g.strokeStyle='#5a3a1a'; g.lineWidth=Math.max(1.5,z*.08); g.beginPath(); g.moveTo(z*.08,v); g.lineTo(z*.04,v+z*.32); g.moveTo(z*.92,v); g.lineTo(z*.96,v+z*.32); g.stroke(); }

    if(LY('roof')){ hipRoof(-z*.06,z*.08,z*.3,z*.48,PAL.tile,{kind:'gable',shadow:true}); hipRoof(z*.76,z*.08,z*.3,z*.48,PAL.tile,{kind:'gable',shadow:true});
      hipRoof(-z*.1,-z*.2,z*1.2,z*.4,PAL.tile,{kind:'gable',shadow:true}); }
  }else{ // 櫓門：門の上に白壁の櫓が渡る。左右の石垣・塀に跨るので幅広

}

  // 兵
  for(const u of S.units){

  { const bg=S.groups[3]; if(S.phase==='battle'&&bg.tai&&(S.mode==='siege'||bg.auto||bg.load)){
      const pul=.5+.5*Math.sin(time/300), t=bg.tai;

      else { const kd=S.kura!=null?[S.kura%COLS+.5,((S.kura/COLS)|0)+.5]:[t.hx,t.hy], hx=sx(kd[0]),hy=sy(kd[1]);

  { const cg=S.groups[4]; if(S.phase==='battle'&&cg.tai&&!cg.tai.dead&&S.kura!=null){ const pul=.5+.5*Math.sin(time/300), t=cg.tai, hx=sx(S.kura%COLS+.5), hy=sy(((S.kura/COLS)|0)+.5);

  // 出陣部隊：指示の矢印・到着時の隊列

    else { g.strokeStyle=gr.col+'99';g.lineWidth=2;g.setLineDash([5,5]);g.beginPath();g.moveTo(sx(t.x),sy(t.y));g.lineTo(sx(goal[0]),sy(goal[1]));g.stroke();g.setLineDash([]);

      g.fillStyle=gr.col;g.fillRect(px+r*.5,py-r*2.4,r*.9,r*1.3); }
    tok(px,py,r,u.isTai?'#20242e':(d.col||'#555'),gr.col,Math.round(Math.max(2,z*(u.isTai?.1:.07))*2)/2,u.rout?'退':d.c,r*1.15,'#fff');
    g.globalAlpha=1; }
    if(u.hp<u.max) bar(px-r,py+r+1,r*2,u.hp/u.max,'#4cd060');
    if(u.isTai&&gr.bugyo&&S.phase==='battle'){ const s=gr.load?'米'+gr.load:(gr.loadT>0?'受取'+Math.ceil(3-gr.loadT):''); if(s){ txt(s,px,py-r*2.9,Math.max(10,z*.32),'#ffd27a',true);} }
  }
  const FXL={arrow:[],shot:[],earrow:[],eshot:[]};
  for(const f of S.fx){
    if(f.type in FXL){ FXL[f.type].push(f); continue; }
    if(f.type==='txt'){ g.globalAlpha=Math.min(1,f.t*2); txt(f.s,sx(f.x),sy(f.y-(.8-f.t)),z*.35,'#ffd27a',true); g.globalAlpha=1; }
    else if(f.type==='boom'){ g.globalAlpha=Math.max(0,f.t); g.fillStyle='#c8b8a0'; g.beginPath(); g.arc(sx(f.x),sy(f.y),z*(1.1-f.t),0,7); g.fill(); g.globalAlpha=1; }
    else{
      g.strokeStyle=f.type==='arrow'?'#fff3c0':f.type==='shot'?'#ffd060':f.type==='earrow'?'#ffb0a0':'#ff8060';
      g.lineWidth=(f.type==='arrow'||f.type==='earrow')?1.2:1.8; g.globalAlpha=Math.min(1,f.t*5);

  for(const ty in FXL){ const L=FXL[ty]; if(!L.length) continue;

    g.lineWidth=(ty==='arrow'||ty==='earrow')?1.2:1.8;
    // 透明度は3段階にまとめて一括描画
    for(const[lo,hi,al] of [[.2,99,1],[.1,.2,.75],[-1,.1,.35]]){ let n=0; g.beginPath();
      for(const f of L){ if(f.t<lo||f.t>=hi) continue; g.moveTo(sx(f.x1),sy(f.y1)); g.lineTo(sx(f.x2),sy(f.y2)); n++; }
      if(n){ g.globalAlpha=al; g.stroke(); } }
    if(ty==='shot'||ty==='eshot'){ g.fillStyle='#ddd8'; g.globalAlpha=1; g.beginPath();
      for(const f of L){ const x=sx(f.x1),y=sy(f.y1),r=Math.max(1,z*.18*(1.3-f.t*2)); g.moveTo(x+r,y); g.arc(x,y,r,0,7); } g.fill(); }
    g.globalAlpha=1; }
  if(S.rain&&S.phase==='battle'){
    g.fillStyle='rgba(20,30,50,.25)'; g.fillRect(0,0,W,H);
    g.strokeStyle='rgba(180,200,255,.5)'; g.lineWidth=1; g.beginPath();
    for(const r of rainDrops){ const yy=((r.y+time/900*r.s)%1)*H, xx=((r.x+time/4000)%1)*W; g.moveTo(xx,yy); g.lineTo(xx-3,yy+12); }
    g.stroke();
  }

function paintAt(x,y){

function endPtr(ev){

function capRaw(w,h,fn){

function gridEditor(host,w,h,drawPix,onPaint,onDone){ // ドット格子の編集画面（ペン・塗りつぶし・消しゴム）

function renderTester(){ const el=document.getElementById('tst'), fmt=(v,st)=>st<1?(+v).toFixed(st<.1?2:2).replace(/0$/,''):String(v);
  let h='<div class="th"><h2>テスターモード</h2><button id="tclose2">閉じる</button></div><div class="prev" id="tprev"></div>';
  h+='<div class="sec"><h3>すぐ試す</h3><div class="acts"><button data-a="gold">金 +1000</button><button data-a="heal">天守・門を回復</button><button data-a="kill">敵を全滅（合戦中）</button><button data-a="wavem">陣 −1</button><button data-a="wavep">陣 +1</button><button data-a="new">新しい城（初期の金で）</button><button data-a="reset" class="warn">すべて初期値に戻す</button></div></div>';
  for(const[title,rows] of TUNE_UI){ h+='<div class="sec"><h3>'+title+'</h3>';
    for(const[k,lab,a,b,st,note] of rows){ const mod=TUNE[k]!==TUNE_DEF[k];
      if(a==='tg') h+='<div class="row'+(mod?' mod':'')+'"><label>'+lab+'</label><button class="tg'+(TUNE[k]?' on':'')+'" data-k="'+k+'"></button></div>';
      else h+='<div class="row'+(mod?' mod':'')+'"><label>'+lab+(note?'<small>'+note+'</small>':'')+'<small>初期値 '+fmt(TUNE_DEF[k],st)+'</small></label><output>'+fmt(TUNE[k],st)+'</output><input type="range" min="'+a+'" max="'+b+'" step="'+st+'" value="'+TUNE[k]+'" data-k="'+k+'"></div>'; }
    h+='</div>'; }
  el.innerHTML=h; testerPreview();
  el.querySelector('#tclose2').onclick=()=>{ el.classList.add('hide'); buildTools(); ui(); };
  el.querySelectorAll('input[type=range]').forEach(r=>{ r.oninput=()=>{ const k=r.dataset.k, v=+r.value; TUNE[k]=v; r.previousElementSibling.textContent=fmt(v,+r.step); r.parentElement.classList.toggle('mod',v!==TUNE_DEF[k]); applyTune(); tuneSave(); testerPreview(); }; });
  el.querySelectorAll('.tg').forEach(b=>{ b.onclick=()=>{ const k=b.dataset.k; TUNE[k]=TUNE[k]?0:1; b.classList.toggle('on',!!TUNE[k]); b.parentElement.classList.toggle('mod',TUNE[k]!==TUNE_DEF[k]); applyTune(); tuneSave(); }; });
  el.querySelectorAll('[data-a]').forEach(b=>{ b.onclick=()=>testerAct(b.dataset.a); });
}
function testerPreview(){ const p=document.getElementById('tprev'); if(!p) return; const nw=S.wave+(S.phase==='battle'?0:1); const ws=[]; for(let w=1;w<=30;w++) ws.push(w);
  const line=ws.filter(w=>w<=12||w%5===0).map(w=>'<span style="color:'+(w===nw?'#ffd27a':isSiege(w)?'#9cf':isBossW(w)?'#ff9a80':'inherit')+'">'+w+':'+waveTotal(w)+'</span>').join(' ');
  p.innerHTML='陣ごとの敵の人数（<span style="color:#9cf">兵糧攻め</span>・<span style="color:#ff9a80">総攻め</span>・<span style="color:#ffd27a">次の陣</span>）<br>'+line+'<br>次は第'+nw+'陣「'+waveName(nw)+'」 敵 '+waveTotal(nw)+'人・一組 '+squadSize(nw)+'人・体力 ×'+(TUNE.eHp*(1+TUNE.hpGrow*(nw-1))).toFixed(2); }
function testerAct(a){
  if(a==='gold'){ S.gold+=1000; toast('金 +1000'); }
  else if(a==='heal'){ if(S.ten) S.ten.hp=S.ten.max; for(const g_ of S.gates.values()){ g_.broken=false; g_.hp=g_.max; } recompute(); toast('回復した'); }
  else if(a==='kill'){ if(S.phase==='battle'){ for(const e of S.enemies) e.dead=true; S.camps.forEach(c=>{ c.q=[]; c.dead=true; }); toast('敵を全滅させた'); } else toast('合戦中のみ'); }
  else if(a==='wavep'||a==='wavem'){ if(S.phase!=='prep'){ toast('普請中のみ'); return; } S.wave=Math.max(0,S.wave+(a==='wavep'?1:-1)); setArea(); recompute(); fit(); buildTools(); toast('次は第'+(S.wave+1)+'陣「'+waveName(S.wave+1)+'」'); }
  else if(a==='new'){ newGame(); fit(); buildTools(); toast('新しい城（'+S.gold+'両）'); }
  else if(a==='reset'){ if(!confirm('すべての調整値を初期値に戻しますか？')) return; TUNE=Object.assign({},TUNE_DEF); applyTune(); tuneSave(); renderTester(); toast('初期値に戻した'); return; }
  ui(); testerPreview(); }
function showHelp(){
  showOv('<h1>戦国築城記</h1><p class="sub">城を築き、果てしなく押し寄せる敵勢をしのぐ。何陣まで守り抜けるか。</p><ol>'+
  '<li>はじめは山城<span>最初の築城範囲は山のまわりだけ（16×16）。山の段を石垣で囲い、坂の下に門、頂に天守、城内に蔵。陣が進むと二の丸（第3陣）・三の丸（第5陣）・総構え（第8陣）と範囲が広がる。必要に応じて曲輪を増やしていく。</span></li>'+
  '<li>地形を盛る・掘る<span>盛土は最大5段。範囲は 1×1〜3×3。1段の差は味方は越えられず、石垣の無い段差は敵がよじ登る。坂（0.5差）でつなぐ。</span></li>'+
  '<li>石垣・土塀と門で囲む<span>敵が壊せるのは門だけ。石垣の無い段差は敵がよじ登る。梯子足軽は石垣・土塀に梯子を掛ける（櫓のマスには掛けられない）。土塀の陰の弓・鉄砲は被弾が減る。</span></li>'+
  '<li>本丸御殿（第3陣〜）を増築し、武家屋敷（第5陣〜）を建てる<span>広がった曲輪に建てて城内に囲う。最初は歩兵と弓兵だけ。増築1つ目で槍、2つ目で鉄砲、3つ目で騎馬。屋敷1つで部隊1つ。どれもマスを塞ぎ、敵に火を放たれると焼けて使えなくなる。</span></li>'+
  '<li>守備兵と部隊を置く<span>部隊は大将を長押し→指で方向。開いた門から打って出る。</span></li>'+
  '<li>開戦<span>敵は虎口を見て外に陣を張る。兵站は時間で減り、兵糧は蔵へ運び込む。兵糧攻めでは街道から来る荷駄隊を守り抜く。</span></li></ol>'+
  '<p class="sub" style="margin-top:12px">二本指で拡大・移動。困ったら ☰ →「お手本」。</p>'+
  '<button id="startbtn">はじめる</button>');
  document.getElementById('startbtn').onclick=hideOv;
}

// ================= ループ =================
let last=performance.now(), uiT=0, frameN=0, lastInput=0;
['pointerdown','pointermove','wheel','keydown'].forEach(t=>window.addEventListener(t,()=>{lastInput=performance.now();},{passive:true,capture:true}));
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(gest&&gest.mode==='pending'&&gest.tai>=0&&S.phase==='battle'&&now-gest.t0>260) startSteer();
  for(let s=0;s<S.speed;s++) update(dt);
  { const L=S.fx; let n=0; for(let i=0;i<L.length;i++){ const f=L[i]; f.t-=dt*S.speed; if(f.t>0) L[n++]=f; } L.length=n; }
  // 普請中に何も触っていない時は描画を30fpsに落として電池を節約
  const idle=S.phase!=='battle'&&!gest&&now-lastInput>2000&&!(document.getElementById('kit')&&!document.getElementById('kit').classList.contains('hide'));
  if(!idle||(frameN++&1)===0) draw(now);
  uiT-=dt; if(uiT<=0){ if(S.phase==='battle') ui(); uiT=.25; }
  requestAnimationFrame(loop);
}
window.addEventListener('resize',()=>{resize();});
newGame(); resize(); fit(); buildTools(); showHelp();
requestAnimationFrame(loop);
</script>
